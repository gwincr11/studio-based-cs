services:
  - type: web
    name: studio-flask-starter
    runtime: python
    plan: free
    rootDir: starter
    buildCommand: pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: bash script/start
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: NODE_VERSION
        value: 22
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
